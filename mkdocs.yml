site_name: OpenWrt for Mere Mortals
site_description: A Linux distribution that turns a router into a machine you can read. Firmware images taken apart file by file, the UCI configuration system read in the original, packages and firewall defaults from a real download, and an image built to order in the lab, with the limits stated plainly.
